name: Thermostat
products:
  - id: s9kq7vlw9wag1ggo
    manufacturer: Herschel
    model: iQ MD2
    model_id: T-MD2
entities:
  - entity: climate
    translation_only_key: thermostat
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: true
            value: heat
          - dps_val: false
            value: "off"
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 50
          max: 450
        mapping:
          - scale: 10
            step: 5
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: Auto
            value: program
          - dps_val: Manual
            value: manual
          - dps_val: Eco
            value: eco
      # Changes roughly 10 seconds after the setpoint crosses room temperature.
      - id: 14
        type: string
        name: hvac_action
        mapping:
          - dps_val: working
            value: heating
          - dps_val: no_working
            value: idle
            constraint: hvac_mode
            conditions:
              - dps_val: false
                value: "off"
      - id: 19
        type: string
        name: display_unit
      # 20 and 21 mirror the setpoint and room temperature in whole Fahrenheit.
      - id: 20
        type: integer
        name: temperature_f
        hidden: true
      - id: 21
        type: integer
        name: current_temperature_f
        hidden: true
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  # Weekly programme: 7 days (Monday first) x 4 slots, each slot 2 bytes
  # minutes since midnight then 2 bytes temperature x 100, big-endian.
  # Only reported when the programme is edited, never in a status reply.
  - entity: text
    translation_key: schedule
    hidden: true
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        optional: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 13
        type: bitfield
        name: fault_code
